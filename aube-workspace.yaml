packages:
  - "apps/*"
  - "packages/*"

catalogs:
  lint:
    oxlint: 1.93.0
    oxlint-tsgolint: 7.0.2006
    eslint-plugin-check-file: 3.3.2
    oxlint-tailwindcss: 1.17.1
  build:
    typescript: 7.0.2
    vite: 8.3.8
    "@vitejs/plugin-react": 6.3.0
    "@types/node": 26.6.6
  test:
    vitest: 5.1.0
  react:
    react: 19.3.1
    react-dom: 19.3.1
    "@types/react": 19.3.0
    "@types/react-dom": 19.3.0
  styles:
    tailwindcss: 4.3.5
    "@tailwindcss/vite": 4.3.5
  ui:
    lucide-react: 1.72.0
    sonner: 2.0.8
  solana:
    "@solana/kit": 8.6.0
    "@solana/kit-plugin-rpc": 0.23.0
    "@solana/react": 8.6.0
    "@solana-program/token": 0.18.0
    "@solana/kit-plugin-signer": 0.23.0
    "@solana/wallet-account-signer": 8.6.0
    "@wallet-standard/ui-registry": 1.1.1
  wallet:
    "@web3auth/no-modal": 11.4.3
    "@wallet-standard/features": 1.1.1
    barcode-detector: 3.2.3
    # Exactly the version barcode-detector pins: we serve its .wasm from the app.
    zxing-wasm: 3.1.6
  i18n:
    "@inlang/paraglide-js": 3.2.2
    "@inlang/plugin-message-format": 4.6.0
  forms:
    "@tanstack/react-form": 1.33.5
    zod: 4.6.7
  merchant:
    qrcode.react: 4.2.0
  router:
    "@tanstack/react-router": 1.170.46
    "@tanstack/react-router-devtools": 1.167.3
    "@tanstack/router-plugin": 1.169.0
  devtools:
    "@tanstack/react-devtools": 0.10.14
  api:
    elysia: 1.4.32
    "@types/bun": 1.4.5
  env:
    varlock: 1.24.0
    "@varlock/vite-integration": 1.5.5
    "@varlock/infisical-plugin": 2.1.3

autoInstallPeers: true

# eslint-plugin-check-file runs inside oxlint (`jsPlugins`) and only uses
# `eslint` for types. Optional, so `autoInstallPeers` doesn't install ESLint.
packageExtensions:
  eslint-plugin-check-file:
    peerDependenciesMeta:
      eslint:
        optional: true

# Reviewed install scripts, not needed for browser bundles (via @web3auth/no-modal).
allowBuilds:
  # `postinstall` only warns about how dependents pin its version.
  protobufjs: false
  # Builds optional native bindings; falls back to the pure JS implementation.
  tiny-secp256k1: false

# Reviewed trust downgrades (published without provenance while earlier
# versions had it). All come from WalletConnect, pulled in by @web3auth/no-modal.
# Exact versions only: new releases are still checked.
trustPolicyExclude:
  # Pinned by @walletconnect/relay-auth. Published manually by the same
  # maintainer (paulmillr) on 2025-01-03; 1.8.1 / 1.7.1 have provenance again.
  - "@noble/curves@1.8.0"
  - "@noble/hashes@1.7.0"
  # Via pino (^0.3.0). Published manually by the pino maintainer
  # (matteo.collina); 0.3.0 and 0.3.1 were published by GitHub Actions.
  - "slow-redact@0.3.2"
