name: Security

on:
  schedule:
    - cron: "0 6 * * 1" # Weekly
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  FORCE_COLOR: 3

jobs:
  audit:
    name: Audit dependencies
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup

      # No fixed picomatch exists yet: remove --ignore when #27 is done.
      - name: Audit dependencies
        run: aube audit --audit-level=high --ignore GHSA-fc5q-39xc-vjpf

  zizmor:
    name: Audit GitHub Actions workflows
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      security-events: write # uploads the SARIF results to the Security tab
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Findings go to the Security tab and don't fail the job: the ruleset's
      # code scanning merge protection is what blocks the merge.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
