name: Security

on:
  schedule:
    - cron: "0 6 * * 1" # Weekly
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  FORCE_COLOR: 3

jobs:
  audit:
    name: Audit dependencies
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup

      # No fixed picomatch exists yet: remove --ignore when #27 is done.
      - name: Audit dependencies
        run: aube audit --audit-level=high --ignore GHSA-fc5q-39xc-vjpf

  zizmor:
    name: Audit GitHub Actions workflows
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      security-events: write # uploads the SARIF results to the Security tab
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Findings go to the Security tab and don't fail the job: the ruleset's
      # code scanning merge protection is what blocks the merge.
      - name: Run zizmor
        id: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1

      # Kept for the zizmor-pr-head job below.
      - name: Save the results
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zizmor-sarif
          path: ${{ steps.zizmor.outputs.output-file }}
          retention-days: 1

  # On a PR, zizmor-action uploads to the test merge commit. GitHub can
  # regenerate that commit with a new SHA, and then code scanning merge
  # protection keeps waiting for zizmor. This uploads the same results to the
  # PR's head commit, which doesn't change (CodeQL's default setup uploads
  # there too). It's a separate job because upload-sarif allows only one
  # upload per tool and category in a job.
  zizmor-pr-head:
    name: Upload zizmor results to the PR head
    needs: zizmor
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      security-events: write # uploads the SARIF results to the Security tab
    steps:
      # upload-sarif reads the source files to fingerprint the results.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zizmor-sarif
          path: ${{ runner.temp }}/zizmor-sarif

      - name: Upload results to the PR head commit
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/zizmor-sarif/zizmor
          category: zizmor
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          sha: ${{ github.event.pull_request.head.sha }}
