name: Security

on:
  # Weekly, to catch advisories published after the code last changed.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths: [".github/**"]
  push:
    branches: [main]
    paths: [".github/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  FORCE_COLOR: 3

jobs:
  # CI already audits every PR; this covers weeks without changes.
  audit:
    name: Audit dependencies
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Audit dependencies
        run: aube audit --audit-level=high

  zizmor:
    name: Audit GitHub Actions workflows
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read # check out a private repo
      actions: read # read workflow metadata on a private repo
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Advanced Security isn't available on this private repo, so
          # findings fail the job instead of going to the Security tab.
          advanced-security: false
