name: CI

on:
  # No branch filter: every PR gets CI, whatever its base branch.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  FORCE_COLOR: 3
  TURBO_TELEMETRY_DISABLED: 1
  VARLOCK_TELEMETRY_DISABLED: 1
  # Varlock loads the committed .env.test files: no Infisical access in CI.
  APP_ENV: test

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup

      - name: Check formatting
        run: aube exec --no-install turbo run format

  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup
        with:
          turbo-cache: true

      - name: Lint and type-check
        run: aube exec --no-install turbo run lint --continue=dependencies-successful

      - name: Check package boundaries
        run: aube exec --no-install turbo boundaries

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup
        with:
          turbo-cache: true

      - name: Build
        run: aube exec --no-install turbo run build --continue=dependencies-successful --summarize

      - name: Upload the Turborepo run summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: turbo-run-summary
          path: .turbo/runs/
          retention-days: 7
          if-no-files-found: ignore

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup
        with:
          turbo-cache: true

      - name: Test
        run: aube exec --no-install turbo run test --continue=dependencies-successful

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup

      # No fixed picomatch exists yet: remove --ignore when #27 is done.
      - name: Audit dependencies
        run: aube audit --audit-level=high --ignore GHSA-fc5q-39xc-vjpf

  secrets:
    name: Scan for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scans the commits between the base and the head
          persist-credentials: false

      - name: Scan new commits for secrets
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          # The action pulls the `latest` CLI image by default: pin it too.
          # Dependabot only bumps the action: keep this in sync with its tag.
          version: 3.99.8@sha256:674b2f187620a19df77f44cf9a7d77efcc581a5662accef2f2739cbb46ba4a3a
          extra_args: --results=verified,unknown

  ci-ok:
    name: CI OK
    if: always()
    needs: [format, lint, build, test, audit, secrets]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
