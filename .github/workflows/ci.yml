name: CI

on:
  # No branch filter: stacked PRs target other branches, not just main.
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  FORCE_COLOR: 3
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup

      - name: Check formatting
        run: aube exec --no-install oxfmt --check

  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup
        with:
          turbo-cache: "true"

      - name: Lint and type-check
        run: aube exec --no-install turbo run lint --ui=stream --continue=dependencies-successful

      - name: Check package boundaries
        run: aube exec --no-install turbo boundaries

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup
        with:
          turbo-cache: "true"

      - name: Build
        run: aube exec --no-install turbo run build --ui=stream --continue=dependencies-successful --summarize

      - name: Upload the Turborepo run summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: turbo-run-summary
          path: .turbo/runs/
          retention-days: 7
          if-no-files-found: ignore

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup

      - name: Audit dependencies
        run: aube audit --audit-level=high

  # The only check branch protection needs to require: it fails if any job
  # above failed or was cancelled, so new jobs don't need new required checks.
  ci-ok:
    name: CI OK
    if: always()
    needs: [format, lint, build, audit]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
