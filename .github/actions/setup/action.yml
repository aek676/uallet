name: Setup
description: >
  Install aube, Node.js and the workspace dependencies (with a node_modules
  cache), and optionally connect Turborepo to the GitHub Actions cache.

inputs:
  node-version:
    description: >
      Node.js version. `auto` can't be used: mise doesn't accept the
      `>=26.13.1` range from `devEngines.runtime`, so this is the lowest
      major that `engines.node` allows.
    required: false
    default: "26"
  turbo-cache:
    description: Connect Turborepo to the GitHub Actions cache ("true"/"false").
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install aube, Node.js and dependencies
      uses: jdx/aube-action@c0d7e61d732be4362538a371e6d9a910d2cb5be8 # v1.1.2
      with:
        # Keep in sync with `devEngines.packageManager` in package.json.
        version: 2.10.0
        node-version: ${{ inputs.node-version }}
        run-install: true
        cache: true
        cache-path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules

    - name: Connect Turborepo to the GitHub Actions cache
      if: inputs.turbo-cache == 'true'
      uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
